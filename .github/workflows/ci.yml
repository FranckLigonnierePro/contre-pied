name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Types, arbitrage et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      # L'arbitrage est de la logique pure : c'est la seule partie du jeu qu'on
      # peut verifier sans navigateur ni physique, et celle ou une regression
      # passe le plus facilement inapercue.
      - name: Tests de l'arbitrage
        run: npm test

      - name: Build
        run: npm run build

  fumee:
    name: Test de fumee
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build

      # Le jeu tourne pour de vrai : on sert le build, on joue des echanges au
      # clavier et on echoue sur la moindre erreur console. C'est ce qui attrape
      # les explosions de la simulation, qu'aucun test unitaire ne verra.
      - name: Servir le build, jouer des echanges et simuler des matchs
        run: |
          npm run preview &
          preview=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173 > /dev/null; then break; fi
            sleep 1
          done
          npm run smoke
          # Une meme graine doit rejouer exactement la meme partie : c'est ce
          # qui rend les chiffres ci-dessous comparables d'un commit a l'autre.
          npm run sim -- 20 1 --determinisme
          # Equilibrage : deux IA jouent 100 points et le resultat doit rester
          # dans des fourchettes. Un reglage peut sortir le jeu de sa zone
          # jouable sans casser le moindre test.
          npm run sim 100 1
          kill $preview
