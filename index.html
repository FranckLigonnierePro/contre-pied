<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover : l'app va sous l'encoche et la barre de geste,
      les retraits sont repris en CSS avec env(safe-area-inset-*).
      maximum-scale=1 : evite le zoom involontaire au double-tap sur une carte.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CONTRE-PIED — une carriere, un match a la fois</title>
    <meta
      name="description"
      content="Un deckbuilder ou tu joues la carriere d'un footballeur. L'adversaire, c'est le match."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
